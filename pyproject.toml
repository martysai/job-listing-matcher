[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-listing-matcher"
version = "0.2.0"
description = "Job matching service: retrieve, rerank, and recommend vacancies."
requires-python = ">=3.10"
dependencies = [
    # Shared across backend server, adzuna scheduler, and dev
    "langchain==1.2.13",
    "langchain-core==1.2.22",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-community",
    "langchain-litellm",
    "langchain-mistralai==1.1.2",
    "sentence-transformers",
    "rank-bm25",
    "langgraph",
    "litellm",
    "anthropic",
    "mistralai==2.1.3",
    "openai>=1.40",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "beautifulsoup4",
    "lxml",
    "requests",
]

[project.optional-dependencies]
# Use case 1 & 3 (backend server + adzuna scheduler — same install)
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "duckdb>=1.0.0",
]
# LambdaRank reranker
rerank = [
    "lightgbm",
]
# Dev machines: scripts, tests, notebooks
dev = [
    "pytest",
    "pytest-asyncio",
    "matplotlib",
    "pandas",
    "numpy",
]
# DVC with Google Drive remote (data lives outside the repo — see README)
dvc = [
    "dvc[gdrive]>=3.0",
]

[tool.setuptools.packages.find]
where = ["backend/services"]

[tool.pytest.ini_options]
pythonpath = ["backend/services"]
testpaths = ["tests"]
asyncio_mode = "auto"
