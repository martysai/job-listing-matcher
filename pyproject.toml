[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-listing-matcher"
version = "0.1.0"
description = "Job matching service: retrieve, rerank, and recommend vacancies."
requires-python = ">=3.10"
dependencies = [
    # Shared across backend server, adzuna scheduler, and dev
    "langchain-core",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-community",
    "langchain-litellm",
    "sentence-transformers",
    "rank-bm25",
    "langgraph",
    "litellm",
    "anthropic",
    "mistralai",
    "pydantic>=2.0",
    "python-dotenv",
    "beautifulsoup4",
    "lxml",
    "requests",
]

[project.optional-dependencies]
# Use case 1 & 3 (backend server + adzuna scheduler — same install)
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "duckdb>=1.0.0",
]
# LambdaRank reranker
rerank = [
    "lightgbm",
]
# Dev machines: scripts, tests, notebooks
dev = [
    "pytest",
    "matplotlib",
    "pandas",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["backend/services"]

[tool.pytest.ini_options]
pythonpath = ["backend/services"]
testpaths = ["tests"]
