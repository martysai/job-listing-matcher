[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sara-retrieve-rerank"
version = "0.1.0"
description = "Structured retrieve and rerank experiment extracted from a Colab notebook."
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-community",
    "langchain-litellm",
    "sentence-transformers",
    "rank-bm25",
    "lxml",
    "beautifulsoup4",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
